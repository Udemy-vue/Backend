<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lodin</title>
	<style>

	</style>
</head>
<body>
	<form action="" id="form">
		<input type="text" id="a" placeholder="Email">
		<input type="text" id="b" placeholder="Password">
		<button type="submit">boton</button>
		<h2>Token: </h2>
		<p id="c" style="width: 5rem"></p>
		<h2>ExpiresIn: </h2>
		<p id="d"></p>
	</form>
	<script>

		// const password = "123123";
		// const email = "penelope@test.com";

		form.addEventListener("submit", async function (e) {
			e.preventDefault();
			// console.log('holamundo')
			try {
				// const form = document.getElementById("form");
				const password = document.getElementById("b");
				const email = document.getElementById("a");

				const res = await fetch('http://localhost:4050/api/login', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify({
						email: email.value,
						password: password.value
				  })
				});
				// console.log('hola mundo')
				console.log(res.ok, res.status);

				const data = await res.json();

				document.getElementById('c').textContent = data.token;
				document.getElementById('d').textContent = data.expiresIn;
			} catch(e) {
				// statements
				console.log(e);
			}
		});
	</script>
</body>
</html>
